name: Update kitchen dish previews
on:
  push:
    paths:
      - '.github/workflows/update-kitchen.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dish image lightbox
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=""".dish-modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(10px)}.dish-modal.open{display:flex}.dish-card{position:relative;width:min(980px,100%);max-height:90vh;overflow:hidden;background:var(--paper);color:var(--ink);border-radius:24px;display:grid;grid-template-columns:1.15fr .85fr;box-shadow:0 30px 90px rgba(0,0,0,.45)}.dish-photo{min-height:560px;background:#161a1d}.dish-photo img{width:100%;height:100%;display:block;object-fit:cover}.dish-info{padding:55px 45px;display:flex;flex-direction:column;justify-content:center}.dish-info h3{font:600 clamp(34px,4vw,52px)/1.05 'Playfair Display';margin:12px 0 18px}.dish-info p{color:#625e56;line-height:1.75;margin:0 0 24px}.dish-meta{display:inline-flex;align-items:center;gap:9px;color:#8a806e;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.dish-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}.dish-close{position:absolute;right:18px;top:15px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:27px;cursor:pointer;z-index:2}.dish-nav{display:flex;gap:10px;margin-top:28px}.dish-nav button{border:1px solid #d8d0c2;background:transparent;padding:11px 15px;border-radius:999px;cursor:pointer}.dish-nav button:hover{background:var(--ink);color:var(--cream)}.view-btn{border:0;background:none;color:var(--gold);font-weight:700;cursor:pointer;padding:0;white-space:nowrap}.view-btn:hover{text-decoration:underline;text-underline-offset:4px}@media(max-width:800px){.dish-card{grid-template-columns:1fr;max-height:92vh;overflow:auto}.dish-photo{min-height:300px;height:42vh}.dish-info{padding:30px 25px}.dish-info h3{font-size:36px}.dish-close{right:12px;top:12px}}"""
          if '.dish-modal{' not in s:
              s=s.replace('</style>',css+'</style>')
          modal='''<div class="dish-modal" id="dishModal" aria-hidden="true"><div class="dish-card" role="dialog" aria-modal="true" aria-labelledby="dishModalTitle"><button class="dish-close" id="dishClose" aria-label="Close dish preview">×</button><div class="dish-photo"><img id="dishModalImage" alt="Dish preview"/></div><div class="dish-info"><div class="kicker">From our kitchen</div><div class="dish-meta"><span id="dishModalCategory">House favourite</span><span class="dish-dot"></span><span>Tap to explore</span></div><h3 id="dishModalTitle"></h3><p id="dishModalDesc"></p><div class="dish-nav"><button id="dishPrev">← Previous</button><button id="dishNext">Next →</button></div></div></div></div>'''
          if 'id="dishModal"' not in s:
              s=s.replace('<div class="modal" id="modal">',modal+'<div class="modal" id="modal">')
          newjs="""const img={indian:'https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=1400&q=85',paneer:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1400&q=85',curry:'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?auto=format&fit=crop&w=1400&q=85',chicken:'https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=1400&q=85',noodles:'https://images.unsplash.com/photo-1562565652-a0d8f0c59eb4?auto=format&fit=crop&w=1400&q=85',dessert:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=1400&q=85',drink:'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=1400&q=85',coffee:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1400&q=85'};
const items=[
['Fish Tikka','Tandoor-style fish with smoky spices','special',img.indian],['Handi Paneer','Rich handi gravy with soft paneer','paneer',img.paneer],['Mint Mojito','Fresh mint, lime and fizz','drinks',img.drink],['Second Wife Special Paneer','Our signature paneer preparation','special paneer',img.paneer],['Second Wife Special Thali','A generous house thali','special',img.indian],['Malai Kofta','Soft kofta in creamy gravy','paneer',img.curry],['Paneer Lababdar','Paneer in a rich tomato gravy','paneer',img.paneer],['Second Wife Special Pasta','House-style creamy pasta','special',img.noodles],['Second Wife Special Chicken','Signature chicken preparation','special chicken',img.chicken],['Butter Naan','Soft naan finished with butter','paneer',img.indian],['Palak Corn Masala','Spinach and sweet corn masala','paneer',img.paneer],['Roasted Chicken','Roasted chicken with house spices','chicken',img.chicken],['Second Wife Special Sundae','Sweet finish to the meal','drinks',img.dessert],['Paneer Bhurji','Spiced scrambled paneer','paneer',img.paneer],['Chicken Mahrajaa','Royal-style chicken curry','chicken',img.curry],['Soup of the Day','Ask the team for today’s soup','drinks',img.indian],['Cafe Latte Hot Coffee','Hot latte-style coffee','drinks',img.coffee],['Mattan Curry','Slow-cooked mutton curry','chicken',img.curry],['SPL Thali Far Gobi Manchurian Gravy','Special thali with gravy favourite','special',img.indian],['Hakka Noodles','Wok-tossed noodles','paneer',img.noodles]];
const grid=document.getElementById('menuGrid');let currentDish=0;function render(cat='all'){grid.innerHTML=items.map((x,i)=>({x,i})).filter(o=>cat==='all'||o.x[2].includes(cat)).map(o=>`<article class="item"><div><h3>${o.x[0]}</h3><p>${o.x[1]}</p></div><button class="view-btn" data-dish="${o.i}">View</button></article>`).join('');grid.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>openDish(Number(b.dataset.dish)))};render();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});
const dishModal=document.getElementById('dishModal'),dishImage=document.getElementById('dishModalImage'),dishTitle=document.getElementById('dishModalTitle'),dishDesc=document.getElementById('dishModalDesc'),dishCategory=document.getElementById('dishModalCategory');function openDish(i){currentDish=(i+items.length)%items.length;const x=items[currentDish];dishTitle.textContent=x[0];dishDesc.textContent=x[1];dishCategory.textContent=x[2].replaceAll('special','Second Wife Special').replace('paneer','Paneer & Veg').replace('chicken','Chicken').replace('drinks','Drinks & Dessert');dishImage.src=x[3];dishImage.alt=x[0]+' at Second Wife Restaurant';dishModal.classList.add('open');dishModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeDish(){dishModal.classList.remove('open');dishModal.setAttribute('aria-hidden','true');document.body.style.overflow=''}function stepDish(n){openDish(currentDish+n)}document.getElementById('dishClose').onclick=closeDish;document.getElementById('dishPrev').onclick=()=>stepDish(-1);document.getElementById('dishNext').onclick=()=>stepDish(1);dishModal.onclick=e=>{if(e.target===dishModal)closeDish()};document.addEventListener('keydown',e=>{if(!dishModal.classList.contains('open'))return;if(e.key==='Escape')closeDish();if(e.key==='ArrowLeft')stepDish(-1);if(e.key==='ArrowRight')stepDish(1)});"""
          s=re.sub(r'const items=\[.*?document\.querySelectorAll\(\x27\.tab\x27\).*?\}\);',newjs,s,flags=re.S,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Add clickable dish image previews to kitchen menu"
          git push
